name: Release

# A release is made by pushing a version tag, such as v0.2.0. `npm version minor` creates the
# commit and the tag, and `git push --follow-tags` starts this workflow. See CONTRIBUTING.md.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish the release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # To create the release and attach the package to it.
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Check that the tag is the version of the package
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but package.json says $version."
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Pack what users install
        id: pack
        run: echo "file=$(npm pack --silent)" >> "$GITHUB_OUTPUT"
      - name: Install the package somewhere else, and start it from there
        run: |
          npm install --prefix "$RUNNER_TEMP/installed" "./${{ steps.pack.outputs.file }}"
          node scripts/check-start.mjs "$RUNNER_TEMP/installed/node_modules/mcp-server-for-pixinsight/dist/index.js"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # The run was repeated, or the tag was pushed again: the release stays, with the package of this run.
            gh release upload "$GITHUB_REF_NAME" "${{ steps.pack.outputs.file }}" --clobber
          else
            # A tag such as v0.2.0-beta.1 is a pre-release.
            case "$GITHUB_REF_NAME" in *-*) kind="--prerelease" ;; *) kind="" ;; esac
            gh release create "$GITHUB_REF_NAME" "${{ steps.pack.outputs.file }}" --verify-tag --generate-notes $kind
          fi
